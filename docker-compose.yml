services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ironcoach
      POSTGRES_USER: amir
      POSTGRES_PASSWORD: localdev
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amir -d ironcoach"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./ironcoach-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://amir:localdev@db/ironcoach
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET}
      STRAVA_VERIFY_TOKEN: ${STRAVA_VERIFY_TOKEN}
      UPLOAD_DIR: /app/uploads
    volumes:
      - ./ironcoach-api:/app
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./ironcoach-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: ''
    volumes:
      - ./ironcoach-frontend/src:/app/src
    depends_on:
      - backend

volumes:
  postgres_data:
